# Prometheus 抓取配置：抓后端 /metrics（FastAPI + prometheus_client 默认文本格式）。
#
# 默认目标 app:8000（与 docker-compose 的可观测栈一致：prometheus 与 app 同在容器网络）。
# 若 Prometheus 跑在宿主机、后端也在宿主机，把 targets 改成 host.docker.internal:8000
# （Linux 需给 prometheus 容器加 extra_hosts: ["host.docker.internal:host-gateway"]，
#   或直接用 127.0.0.1:8000）；改完重启 prometheus 生效。
#
# 抓取间隔 15s / 保留 15 天（保留期在启动命令 --storage.tsdb.retention.time=15d 里设）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # job 名必须与看板里 up{job="rag-app"} 保持一致，改名要同步改看板
  - job_name: rag-app
    metrics_path: /metrics
    static_configs:
      # 与 docker-compose 的 prometheus/app 同网络：容器内用服务名解析到 app:8000。
      # 本地宿主机跑后端调试时改回 host.docker.internal:8000（Linux 需加 host-gateway）。
      - targets: ["app:8000"]
        labels:
          service: rag-agent